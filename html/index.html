<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Preparation Minigame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Food Preparation Minigame</h1>
        <div class="minigame-area">
            <div class="food-item" id="food-item-1"></div>
            <div class="food-item" id="food-item-2"></div>
            <div class="food-item" id="food-item-3"></div>
        </div>
        <div class="timer">Time: <span id="time-left">30</span></div>
        <div class="score">Score: <span id="score">0</span></div>
        <div class="input-area">
            <input type="text" id="food-input" placeholder="Enter food name">
            <button id="submit-food">Submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
